name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      model:
        type: string
        description: 'Model to use'
        required: false
        default: 'opencode/big-pickle'
      prompty:
        type: string
        description: 'Prompts to use'
        required: true

jobs:
  opencode:
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != '' &&
        (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        )
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        )
      ) || inputs.model
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions-cool/check-user-permission@v2
        id: has_permission
        with:
          require: 'write'

      - name: Exit if no write permission
        if: steps.has_permission.outputs.require-result != 'true'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        if: ${{ github.event.inputs.prompt }}
        uses: anomalyco/opencode/github@3c85719fea0ee83389c814d7abbf1f98c5c6f0f1 # v1.14.25
        with:
          model: opencode/big-pickle
          prompt: ${{ github.event.inputs.prompty }}

      - name: Run OpenCode
        if: ${{ !github.event.inputs.prompt }}
        uses: anomalyco/opencode/github@3c85719fea0ee83389c814d7abbf1f98c5c6f0f1 # v1.14.25
        with:
          model: opencode/big-pickle
