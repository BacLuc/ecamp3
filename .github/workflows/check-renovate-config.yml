name: check-renovate-config.yml
on:
  push:
    paths:
      - .github/workflows/check-renovate-config.yml
      - renovate.json
  pull_request:
    paths:
      - .github/workflows/check-renovate-config.yml
      - renovate.json

jobs:
  validate-renovate-config:
    name: 'renovate: validate config'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - run: docker run --rm -e LOG_LEVEL=debug renovate/renovate --token ${{ secrets.GITHUB_TOKEN }} --include-forks true --pr-hourly-limit 0 --pr-concurrent-limit 0 --binary-source install BacLuc/ecamp3
